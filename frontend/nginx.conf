server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Resolve "backend" through Docker's embedded DNS on each request (the
    # variable in proxy_pass forces that) instead of once at startup: nginx then
    # neither refuses to boot while the backend container is down nor keeps
    # proxying to a stale IP after the backend is recreated (502s on /api).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Proxy API calls to the backend container (URI passed through unchanged)
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A stopped backend's IP stays cached for up to `valid=10s`; the default
        # 60s connect timeout made /api calls hang a full minute before a 504.
        proxy_connect_timeout 5s;
    }

    # Content-hashed build output: cache forever. A missing chunk must be a real
    # 404 — the SPA fallback used to answer it with index.html, which the browser
    # rejects as a JS module, leaving a blank page after every rebuild.
    location /_app/immutable/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — serve index.html for all non-file routes. Always
    # revalidate, so a rebuilt index.html (new chunk hashes) is picked up.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
